version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: getmymoment_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - gmm_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: getmymoment_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-getmymoment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gmm_network

  redis:
    image: redis:7-alpine
    container_name: getmymoment_prod_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gmm_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: getmymoment_prod_api
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-getmymoment}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_LOCAL_ROOT=/app/storage
      - FTP_PUBLIC_HOST=${FTP_PUBLIC_HOST:-16.170.81.162}
      - FTP_PUBLIC_PORT=${FTP_PUBLIC_PORT:-2121}
    volumes:
      - storage_data:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
      - "0.0.0.0:2121:2121"
      - "0.0.0.0:30000-30100:30000-30100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gmm_network

  ai_worker:
    build:
      context: .
      dockerfile: workers/ai_worker/Dockerfile
    container_name: getmymoment_prod_worker
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-getmymoment}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_LOCAL_ROOT=/app/storage
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gmm_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: getmymoment_prod_web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - gmm_network

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  gmm_network:
    driver: bridge
