name: getmymoment
description: "Get My Moment — Studio Business OS & AI Event Photo Delivery Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & HTTP
  http: ^1.2.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage & Persistence
  shared_preferences: ^2.2.2
  
  # Media & Camera
  image_picker: ^1.0.7
  
  # QR Code & Scanning
  qr_flutter: ^4.1.0
  
  # UI & Styling
  google_fonts: ^6.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  
  # Utility & System
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
